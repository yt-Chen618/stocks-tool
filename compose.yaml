services:
  db:
    # PostgreSQL 16.14 (Debian 16.14-1.pgdg13+1), digest captured from the
    # verified local image on 2026-10-02. Keep the digest when refreshing the
    # image so CI and local temporary-PostgreSQL gates run the same server.
    image: postgres:16.14@sha256:bffa6baeb307a531d731bf3ef9835dc396afaeddf81944337b8f990b2109ffca
    container_name: stocks-tool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stocks_tool}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stocks_tool}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
