[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "stocks-tool"
version = "0.1.0"
description = "Trading research and execution workbench for US equities and options."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  # Hatch exact editable mode imports this hook at interpreter startup.
  "editables==0.6",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "longbridge>=4.0.5,<5.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0.36,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stocks_tool"]
dev-mode-exact = true

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/alembic",
  "/docs",
  "/tests",
  "/README.md",
  "/pyproject.toml",
  "/alembic.ini",
  "/compose.yaml",
  "/.env.example",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.12.22"
build-constraint-dependencies = [
  "hatchling==1.32.4",
  "packaging==26.2",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.9.21.13",
]
# Preserve the fully tested Windows runtime while retaining uv's universal
# platform markers. Constraints do not introduce Windows-only dependencies on Linux.
constraint-dependencies = [
  "alembic==1.18.4",
  "annotated-doc==0.0.4",
  "annotated-types==0.7.0",
  "anyio==4.13.0",
  "certifi==2026.4.22",
  "click==8.4.0",
  "colorama==0.4.6",
  "fastapi==0.136.1",
  "greenlet==3.5.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httptools==0.7.1",
  "httpx==0.28.1",
  "idna==3.15",
  "iniconfig==2.3.0",
  "longbridge==4.1.0",
  "mako==1.3.12",
  "markupsafe==3.0.3",
  "packaging==26.2",
  "pluggy==1.6.0",
  "psycopg==3.3.4",
  "psycopg-binary==3.3.4",
  "pydantic==2.13.4",
  "pydantic-core==2.46.4",
  "pydantic-settings==2.14.1",
  "pygments==2.20.0",
  "pytest==8.4.2",
  "python-dotenv==1.2.2",
  "pyyaml==6.0.3",
  "sqlalchemy==2.0.49",
  "starlette==1.0.0",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
  "tzdata==2026.2",
  "uvicorn==0.47.0",
  "watchfiles==1.2.0",
  "websockets==16.0",
]
